name: Imagen

# Buildea la imagen del Dockerfile y la publica en GHCR para la VM
# (quadlets/portal.image en ba-aire/infra). La app de Vercel vive en la rama
# `vercel` y no pasa por acá.
#
# SOLO CON TAGS vX.Y.Z. Publicar en cada merge a main generaba una imagen por cada PR
# de Dependabot. El paquete es privado, así que cada imagen consume cuota de GHCR
# de la org, y casi ninguna se despliega. Un tag es la decisión explícita de "esto
# va a producción", y deja escrito qué versión corre en la VM.
#
# Publicar una versión:
#   git switch main && git pull
#   git tag v0.2.0 && git push origin v0.2.0
# (o un Release en GitHub, que crea el tag). Si el build falla, "Re-run jobs" en
# la corrida; no hace falta otro tag.
#
# Sin workflow_dispatch a propósito: correrlo sobre una rama publicaría una imagen
# sin versión, que es justo lo que este trigger evita. Para probar el Dockerfile
# alcanza con `docker build` local.
on:
  push:
    # v*.*.* y no v*: metadata-action solo arma el tag 0.2.0 de una versión
    # semver completa. Con "v1" o "v1.2" la imagen sale solo con el tag sha-...
    tags: ["v*.*.*"]

concurrency:
  group: imagen-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    name: Build y push a GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Login a GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # Tags legibles para humanos (0.2.0, sha-abc1234). La VM NO los usa:
      # pinnea el digest que imprime el último paso, así "qué corría el 3/8" se
      # responde con un hash y no con un tag que se mueve.
      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/portal
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build y push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Digest para el quadlet
        run: |
          {
            echo "### Imagen publicada"
            echo
            echo "Pegar en \`quadlets/portal.image\` de ba-aire/infra:"
            echo
            echo '```'
            echo "Image=ghcr.io/${{ github.repository_owner }}/portal@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
